<script>
    // Create a WebSocket connection
    const imageElement = document.querySelector(".image");
    const outputElement = document.getElementById("target-input");
    const socket = new WebSocket("ws://localhost:8000/video-feed");

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');

    // Function to capture the local Agora video element and send the frames to the server
    function sendFrame() {
        if (socket.readyState === WebSocket.OPEN) {
            const uid = sessionStorage.getItem("uid");
            // Robustly query either fallback native stream or active Agora container streams
            const localVideo = document.getElementById("fallback-local-video") || document.querySelector(`#user-${uid} video`) || document.querySelector('.video-player video');
            if (localVideo && localVideo.readyState >= 2) {
                // Keep dimensions small for super fast local prediction with lower network overhead
                canvas.width = 320;
                canvas.height = 240;
                ctx.drawImage(localVideo, 0, 0, canvas.width, canvas.height);
                canvas.toBlob((blob) => {
                    if (blob && socket.readyState === WebSocket.OPEN) {
                        socket.send(blob);
                    }
                }, 'image/jpeg', 0.6);
            }
        }
        // Run ~6.6 times per second (150ms interval) for smooth detection and minimal lag
        setTimeout(sendFrame, 150);
    }

    // Event listener for WebSocket messages
    socket.addEventListener("message", function (event) {
        if (typeof event.data === "string") {
            const textElement = document.getElementById("interpreted-text");
            if (textElement) {
                textElement.innerText = event.data;
            }

            // Programmatically broadcast this predicted sign as a chat message so everyone can see it!
            if (typeof displayName !== 'undefined' && event.data && event.data !== "None") {
                // If RTM channel is connected, send it to other participants
                if (typeof channel !== 'undefined' && channel) {
                    try {
                        channel.sendMessage({
                            text: JSON.stringify({
                                'type': 'chat',
                                'message': `[Sign Language]: ${event.data}`,
                                'displayName': displayName
                            })
                        });
                    } catch (e) {
                        console.error("Failed to broadcast sign message:", e);
                    }
                }
                // Add the message to our own local chat screen
                if (typeof addMessageToDom === 'function') {
                    addMessageToDom(displayName, `[Sign Language]: ${event.data}`);
                }
            }
        } else if (event.data instanceof Blob) {
            // Handle binary processed frames from the server
            var blob = new Blob([event.data], { type: "image/jpeg" });
            var url = URL.createObjectURL(blob);
            if (imageElement) {
                imageElement.src = url;
            }
        }
    });

    // Event listener for WebSocket open
    socket.addEventListener("open", function (event) {
      console.log("Connected to WebSocket server");
      sendFrame(); // Start uploading camera frames once connected
    });

    // Event listener for WebSocket close
    socket.addEventListener("close", function (event) {
      console.log("Disconnected from WebSocket server");
    });

    // Event listener for WebSocket errors
    socket.addEventListener("error", function (event) {
      console.error("WebSocket error:", event);
    });
  </script>
